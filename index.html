<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>罫線サイズ 表紙メーカー</title>
<style>
:root{--bg:#f6f5f1;--fg:#222;--card:#fff;--bd:#d8d6cf;color-scheme:light;box-sizing:border-box;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1d1b;--fg:#eee;--card:#2a2a27;--bd:#444;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1d1d1b;--fg:#eee;--card:#2a2a27;--bd:#444;color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--fg);font-family:'Hiragino Sans','Yu Gothic','Noto Sans JP',sans-serif;padding:16px;max-width:760px;margin:auto}
h1{font-size:20px;margin:8px 0 12px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
#grid button{border:2px solid transparent;border-radius:8px;padding:8px 2px;font-size:14px;cursor:pointer;line-height:1.3}
#grid button small{display:block;font-size:10px;opacity:.8}
#grid.gm button small{display:none}
#grid button.on{border-color:var(--fg)}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:14px 0}
select,.act,input{font:inherit;padding:8px 12px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--fg)}
.act{cursor:pointer;font-weight:600}
#stage{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;justify-items:center}
#stage canvas{grid-column:2;grid-row:3}#mt{grid-column:2;grid-row:1}#mtx{grid-column:2;grid-row:2;display:flex;gap:12px;flex-wrap:wrap;justify-content:center}#ml{grid-column:1;grid-row:3}#mr{grid-column:3;grid-row:3}#mb{grid-column:2;grid-row:4}
.mi label{display:flex;flex-direction:column;align-items:center;font-size:12px;gap:2px}
canvas{display:block;margin:0 auto;max-width:100%;max-height:70vh;border:1px solid var(--bd);box-shadow:0 2px 10px #0003}
#msg{min-height:1.4em;font-size:13px}
#tbl table{font-size:12px;border-collapse:collapse}#tbl td{padding:2px 10px;border-bottom:1px solid var(--bd)}
</style></head><body>
<h1>罫線サイズ 表紙メーカー</h1>
<div id="grid"></div>
<div class="row">
<label>種類 <select id="kind"><option value="c">表紙</option><option value="i">中紙（罫線）</option></select></label>
<label>用紙 <select id="paper"></select></label>
<label>紙の単位 <select id="punit"><option value="mm">mm</option><option value="cm">cm</option><option value="in">inch</option></select></label>
<label>向き <select id="ori"><option value="p">縦</option><option value="l">横</option></select></label>
</div>
<div class="row"><label><input id="smm" type="checkbox" checked> サイズ表記</label><label>単位 <select id="unit"><option value="mm">mm</option><option value="cm">cm</option><option value="in">inch</option><option value="mil">mil</option><option value="pt">pt</option><option value="pc">pica</option><option value="px">px（96dpi）</option><option value="Q">Q（級）</option><option value="bu">分（尺貫法）</option><option value="sun">寸（尺貫法）</option></select></label><label>罫線 <select id="dir"><option value="h">横罫</option><option value="v">縦罫</option><option value="g">方眼</option></select></label><label>方眼の幅 <input id="gw" type="number" value="5.00" step="0.5" min="1" style="width:64px"> mm</label><label>線 <select id="lstyle"><option value="n">普通罫線</option><option value="d">ドット罫線</option><option value="t">点線</option></select></label><label>太さ <input id="lw" type="range" min="0.05" max="1" step="0.05" value="0.2"> <output id="lwo"></output></label><label>ドット間隔（倍率） <input id="dg" type="range" min="0.4" max="2.5" step="0.05" value="1"> <output id="dgo"></output></label></div>
<div id="cpaper" class="row"><label>用紙の幅 <input id="pw" type="number" value="200.00" min="0" style="width:72px"> <span class="pu">mm</span></label><label>高さ <input id="ph" type="number" value="280.00" min="0" style="width:72px"> <span class="pu">mm</span></label></div>
<div class="row"><label>背景模様 <select id="pm"><option value="n">なし</option><option value="t">文字</option><option value="i">画像</option><option value="s">シール</option></select></label><label>配置 <select id="par"><option value="tri">三角</option><option value="spi">スパイラル</option><option value="rad">放射状</option><option value="dia">菱形</option></select></label><label id="ptl">文字 <input id="pt" size="6" value="★"></label><label>画像 <input id="pi" type="file" accept="image/*"></label></div>
<div id="prow" class="row"><label>大きさ <input id="ps" type="range" min="3" max="40" step="1" value="8"> <output id="pso"></output></label><label>間隔 <input id="pg" type="range" min="4" max="80" step="1" value="14"> <output id="pgo"></output></label><label>濃さ <input id="pa" type="range" min="5" max="100" step="5" value="20"> <output id="pao"></output></label><label>放射の本数 <input id="pn" type="range" min="4" max="48" step="2" value="16"> <output id="pno"></output></label></div>
<div id="irow" class="row"><label><input id="imgf" type="checkbox"> 画像を手前に</label><label>拡大 <input id="iz" type="range" min="1" max="400" step="1" value="100"> <output></output></label><label>横位置 <input id="ix" type="range" min="0" max="100" step="1" value="50"> <output></output></label><label>縦位置 <input id="iy" type="range" min="0" max="100" step="1" value="50"> <output></output></label><label>画像の濃さ <input id="ia" type="range" min="5" max="100" step="5" value="100"> <output></output></label></div>
<div id="srow"><div class="row"><label><input id="stkf" type="checkbox" checked> シールを手前に</label><label>シール画像（最大10枚） <input id="sf" type="file" accept="image/*" multiple></label><label>選択 <select id="ssel"></select></label><button class="act" id="sdel" type="button">削除</button><span id="scnt">0/10</span></div>
<div class="row"><label>横位置 <input id="sx" type="range" min="0" max="100" step="1" value="50"> <output></output></label><label>縦位置 <input id="sy" type="range" min="0" max="100" step="1" value="50"> <output></output></label><label>大きさ（長辺） <input id="ss" type="range" min="5" max="200" step="1" value="40"> <output></output></label><label>回転 <input id="sr" type="range" min="-180" max="180" step="1" value="0"> <output></output></label><label>濃さ <input id="sa" type="range" min="5" max="100" step="5" value="100"> <output></output></label></div></div>
<div id="cust" class="row"><label>色 <input id="cc" type="color" value="#888888"></label><label>幅 <input id="cw" type="number" value="9.00" step="0.1" min="0.5" style="width:72px"> mm</label><label>記号 <input id="cs" size="4" value="X"></label></div>
<div id="cover" class="row"><label><input id="lbl" type="checkbox" checked> ラベルを表示</label><label>縁の幅（0で縁なし） <input id="edge" type="number" value="5.00" min="0" step="0.5" style="width:64px"> mm</label><label>記号の文字サイズ <input id="fs1" type="range" min="20" max="170" step="3" value="56"> <output id="fs1o"></output></label><label>1行目のラベル <input id="cl1" size="10" placeholder="（空欄）"></label><label>2行目のラベル <input id="cl2" size="10" value="名前"></label></div>
<div id="inner"><div class="row"><label>文字サイズ <input id="fs2" type="range" min="6" max="30" step="3" value="9"> <output id="fs2o"></output></label></div>
<div class="row"><label>行数 <input id="nr" type="number" min="1" placeholder="自動" style="width:72px"></label></div>
<p id="calc"></p>
<details><summary>全サイズの行数表</summary><div id="tbl"></div></details></div>
<div id="stage">
<div id="mt" class="mi"><label>上余白 <input id="mtop" type="number" value="5.00" min="0" style="width:64px"> mm</label></div>
<div id="mtx" class="mi"><label>中央 <input id="tc" size="14" value="No. ________"></label><label>右 <input id="tr" size="22" value="日付 ______年 ____月 ____日"></label></div>
<div id="ml" class="mi"><label>左余白 <input id="mleft" type="number" value="10.00" min="0" style="width:60px"> mm</label></div>
<canvas id="cv"></canvas>
<div id="mr" class="mi"><label>右余白 <input id="mright" type="number" value="10.00" min="0" style="width:60px"> mm</label></div>
<div id="mb" class="mi"><label>下余白 <input id="mbot" type="number" value="5.00" min="0" style="width:64px"> mm</label></div>
</div>
<div class="row"><button class="act" id="one">このサイズをPDFで保存</button><button class="act" id="all">全種類を1つのPDFで保存</button></div>
<p id="msg"></p>
<script>
const F="'Hiragino Sans','Yu Gothic','Noto Sans JP',sans-serif";
const PAPERS=[['B3 (364×515)',364,515],['A3 (297×420)',297,420],['B4 (257×364)',257,364],['A4 (210×297)',210,297],['B5 (182×257)',182,257],['セミB5 (179×252)',179,252],['A5 (148×210)',148,210],['B6 (128×182)',128,182],['A6 (105×148)',105,148],['カスタム',200,280]];
const TINT=[0,.1,.18,.26];
const hexToRgb=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const mix=(a,b,t)=>{const A=hexToRgb(a),B=hexToRgb(b);return '#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join('')};
const darken=(h,t)=>{const [r,g,b]=hexToRgb(h).map(v=>v/255),mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;let l=(mx+mn)/2,sa=0,hu=0;
  if(d){sa=l>.5?d/(2-mx-mn):d/(mx+mn);hu=(mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4)/6}
  l*=1-t;sa=Math.min(1,sa+t*0.3);
  const q=l<.5?l*(1+sa):l+sa-l*sa,p=2*l-q,f=k=>{k=(k+1)%1;return k<1/6?p+(q-p)*6*k:k<.5?q:k<2/3?p+(q-p)*(2/3-k)*6:p};
  return '#'+[f(hu+1/3),f(hu),f(hu-1/3)].map(v=>Math.round(v*255).toString(16).padStart(2,'0')).join('')};
const lum=h=>{const [r,g,b]=hexToRgb(h);return(0.299*r+0.587*g+0.114*b)/255};
// [入力用, 手書き, mm表記, mm値, 色, 段, 市販]
const G=[['ffff','ffff',['0.55'],[0.55],'#b23a6b'],
['fff','fff',['0.65'],[0.65],'#7a4fa3'],
['ff','ff',['0.8'],[0.8],'#1f7a8c'],
['f','f',['1','1 1/4','1 1/2','1 3/4'],[1,1.25,1.5,1.75],'#2aa7a0'],
['e','e',['2','2 1/3','2 2/3'],[2,7/3,8/3],'#f0a04b'],
['d','d',['3','3 1/3','3 2/3'],[3,10/3,11/3],'#5fbf6a'],
['D','D',['4','4 1/3','4 2/3'],[4,13/3,14/3],'#b5d94a'],
['C','C',['5','5 1/2'],[5,5.5],'#7ec8ee',1],
['B','B',['6','6 1/2'],[6,6.5],'#4a7fd4',1],
['A','A',['7','7 1/2'],[7,7.5],'#e0504a',1]];
const rows=[];
G.forEach(([k,h,t,v,c,m])=>t.forEach((tx,i)=>rows.push({key:k+(i?i:''),hw:h+['','′','″','‴'][i],mmT:tx,mm:v[i],hex:darken(c,TINT[i]),mk:m&&i===0})));
[['U','U','8',8,'#d9c8ee',1],['Ul','Ul','9',9,'#b896dc',0],['UL','UL','10',10,'#9a6fc2',1],['Uw','Uw','11',11,'#f6efb4',0],['UW','UW','12',12,'#ecd96a',1],
['Ux','Ux','13.5',13.5,'#f8bfd6',0],['UX','UX','15',15,'#ee8fb4',0],['Uy','Uy','16.5',16.5,'#c5c0f0',0],['UY','UY','18',18,'#9c94e0',0],['Uz','Uz','21',21,'#7468cc',0],['UZ','UZ','25',25,'#5144a8',0],['Uzz','Uzz','30',30,'#f7f7f7',0],['UZz','UZz','35',35,'#d4d4d4',0],['UZZ','UZZ','40',40,'#a6a6a6',0]]
.forEach(([k,h,t,v,c,m])=>rows.push({key:k,hw:h,mmT:t,mm:v,hex:c,mk:!!m}));

function render(r,p,c,s){if($('kind').value==='i')return renderInner(r,p,c,s);
  const W0=Math.round(p[1]*s),H0=Math.round(p[2]*s);c.width=W0;c.height=H0;
  const e=Math.max(0,Math.min(Math.round(num('edge',5)*s),Math.floor(Math.min(W0,H0)/2-10*s))),W=W0-2*e,H=H0-2*e;
  const x=c.getContext('2d'),dark=lum(r.hex)<0.5,fg=dark?'#ffffff':'#222222';
  x.fillStyle='#ffffff';x.fillRect(0,0,W0,H0);x.translate(e,e);
  x.fillStyle=r.hex;x.fillRect(0,0,W,H);drawPattern(x,W,H,s,fg,true);if(!$('stkf').checked)drawStickers(x,W,H,s);
  
  const L=16*s,R=W-8*s,bw=(R-L)*0.78,bh=Math.min(42*s,H*0.16),bx=L+((R-L)-bw)/2,by=H*0.4-bh/2;
  const dir=$('dir').value,pitch=(dir==='g'&&!r.custom?Math.max(1,num('gw',5)):r.mm)*s,lw=num('lw',0.2)*s,st=$('lstyle').value,dg=Math.max(1.2*s,num('dg',1)*pitch),lc=mix(r.hex,dark?'#ffffff':'#000000',0.28);
  x.strokeStyle=lc;x.fillStyle=lc;x.lineWidth=lw;
  const seg=(x1,y1,x2,y2)=>{x.setLineDash(st==='t'?[2*s,1.5*s]:[]);x.beginPath();x.moveTo(x1,y1);x.lineTo(x2,y2);x.stroke();
    if(st==='d'){x.setLineDash([]);const len=Math.hypot(x2-x1,y2-y1),mx=(x1+x2)/2,my=(y1+y2)/2,ux=(x2-x1)/len,uy=(y2-y1)/len,m=Math.floor(len/2/dg+1e-6);
      for(let j=-m;j<=m;j++){x.beginPath();x.arc(mx+ux*j*dg,my+uy*j*dg,Math.max(lw*1.8,0.45*s),0,6.2832);x.fill()}}};
  const aT=14*s,aB=H-36*s;
  if(dir!=='v')for(let y=aT;y<=aB+1e-6;y+=pitch)seg(L,y,R,y);
  if(dir!=='h')for(let xx=L;xx<=R+1e-6;xx+=pitch)seg(xx,aT,xx,aB);
  x.setLineDash([]);
  if($('lbl').checked){x.fillStyle=mix(r.hex,'#ffffff',0.78);x.strokeStyle=fg;x.lineWidth=0.4*s;
  x.fillRect(bx,by,bw,bh);x.strokeRect(bx,by,bw,bh);x.beginPath();x.moveTo(bx,by+bh/2);x.lineTo(bx+bw,by+bh/2);x.stroke();
    x.fillStyle='#222';x.font=`${3.2*s}px ${F}`;x.textBaseline='top';x.textAlign='left';
  x.fillText($('cl1').value,bx+2*s,by+1.5*s);x.fillText($('cl2').value,bx+2*s,by+bh/2+1.5*s);}
  x.fillStyle=fg;x.textBaseline='alphabetic';const fsC=num('fs1',56)*25.4/72*s;x.font=`bold ${fsC}px ${F}`;if(dir==='g'&&!r.custom)symS(x,fsC,L,H-12*s,'left',true);else x.fillText(r.hw,L,H-12*s);
  if(dir!=='g'||r.custom){x.textAlign='right';x.font=`${fsC*0.3}px ${F}`;x.fillText(szt(r.mm),R,H-12*s)}
  if($('imgf').checked&&$('pm').value==='i'&&patImg)drawImg(x,W,H);
  x.fillStyle=mix(r.hex,'#000000',0.5);x.fillRect(0,0,9*s,H);
  if($('stkf').checked)drawStickers(x,W,H,s);
}
function sig2(v){if(!v)return '0';const d=Math.floor(Math.log10(Math.abs(v))),f=Math.pow(10,d-1),r=Math.round(v/f)*f;return r.toFixed(Math.max(0,1-d))}
function symS(x,fs,px,py,align,bold){const sub=sig2(num('gw',5)),b=bold?'bold ':'';
  x.font=`${b}${fs}px ${F}`;const w1=x.measureText('S').width;x.font=`${b}${fs*0.6}px ${F}`;const t=w1+x.measureText(sub).width,sx=align==='right'?px-t:px;
  x.textAlign='left';x.font=`${b}${fs}px ${F}`;x.fillText('S',sx,py);x.font=`${b}${fs*0.6}px ${F}`;x.fillText(sub,sx+w1,py+fs*0.25);x.font=`${b}${fs}px ${F}`}
const PUF={mm:1,cm:10,in:25.4};let puPrev='mm';
const pf=()=>PUF[$('punit').value];
function paperLabels(){const f=pf(),u=$('punit').value;[...$('paper').options].forEach((o,i)=>{const p=PAPERS[i];if(p[0]==='カスタム'){o.textContent='カスタム';return}const nm=p[0].replace(/ \(.*$/,''),fm=v=>u==='mm'?String(v):(v/f).toFixed(2);o.textContent=`${nm} (${fm(p[1])}×${fm(p[2])}${u})`})}
const pp=()=>{let p=PAPERS[$('paper').value];if(p[0]==='カスタム')p=[p[0],Math.max(30,num('pw',200)*pf()),Math.max(30,num('ph',280)*pf())];return $('ori').value==='l'?[p[0],p[2],p[1]]:p};
let stickers=[],sel=0,drag=null;
const sv=(id,d)=>{const e=document.getElementById(id+'n')||document.getElementById(id),r=document.getElementById(id);let v=parseFloat(e.value);if(!isFinite(v))return d;return Math.min(+r.max,Math.max(+r.min,v))};
function setS(id,v){$(id).value=v;const n=$(id+'n');if(n)n.value=(+v).toFixed(2)}
function loadSticker(){const t=stickers[sel];if(!t)return;setS('sx',t.x);setS('sy',t.y);setS('ss',t.size);setS('sr',t.rot);setS('sa',t.alpha)}
function refreshSel(){const o=$('ssel');o.innerHTML='';stickers.forEach((_,i)=>{const e=document.createElement('option');e.value=i;e.textContent='シール '+(i+1);o.append(e)});if(sel>=stickers.length)sel=stickers.length-1;if(sel<0)sel=0;o.value=sel;$('scnt').textContent=stickers.length+'/10'}
function drawStickers(x,W,H,s){if($('pm').value!=='s')return;stickers.forEach(t=>{const k=t.size*s/Math.max(t.img.width,t.img.height);x.save();x.globalAlpha=t.alpha/100;x.translate(t.x/100*W,t.y/100*H);x.rotate(t.rot*Math.PI/180);x.drawImage(t.img,-t.img.width*k/2,-t.img.height*k/2,t.img.width*k,t.img.height*k);x.restore()})}
const cvPos=ev=>{const r=cv.getBoundingClientRect(),e=Math.round(num('edge',5)*5);return{x:(ev.clientX-r.left)*cv.width/r.width-e,y:(ev.clientY-r.top)*cv.height/r.height-e,W:cv.width-2*e,H:cv.height-2*e}};
let patImg=null;
function drawImg(x,W,H){
  const iw=patImg.width,ih=patImg.height,k=Math.max(W/iw,H/ih)*num('iz',100)/100,dw=iw*k,dh=ih*k,ox=(W-dw)*num('ix',50)/100,oy=(H-dh)*num('iy',50)/100;
  x.save();x.beginPath();x.rect(0,0,W,H);x.clip();x.globalAlpha=num('ia',100)/100;x.drawImage(patImg,ox,oy,dw,dh);x.restore()}
function drawPattern(x,W,H,s,col,cov){
  const mode=$('pm').value;if(mode==='n'||mode==='s')return;if(mode==='i'){if(patImg&&cov&&!$('imgf').checked)drawImg(x,W,H);return}
  const sz=num('ps',8)*s,sp=Math.max(2,num('pg',14))*s,al=num('pa',20)/100,arr=$('par').value,txt=$('pt').value||'★';
  x.save();x.beginPath();x.rect(0,0,W,H);x.clip();x.globalAlpha=al;x.fillStyle=col;x.textAlign='center';x.textBaseline='middle';x.font=`${sz}px ${F}`;
  const put=(px,py,ang)=>{if(px<-sz||py<-sz||px>W+sz||py>H+sz)return;x.save();x.translate(px,py);if(ang)x.rotate(ang);
    if(mode==='i'){const k=Math.min(sz/patImg.width,sz/patImg.height);x.drawImage(patImg,-patImg.width*k/2,-patImg.height*k/2,patImg.width*k,patImg.height*k)}else x.fillText(txt,0,0);x.restore()};
  const cx=W/2,cy=H/2,R=Math.hypot(W,H)/2;
  if(arr==='tri'){const dy=sp*0.866;for(let j=0,y=0;y<H+dy;j++,y+=dy)for(let xx=(j%2?sp/2:0);xx<W+sp;xx+=sp)put(xx,y,0)}
  else if(arr==='dia'){const h=sp/2;for(let j=0,y=0;y<H+h;j++,y+=h)for(let xx=(j%2?h:0);xx<W+sp;xx+=sp)put(xx,y,0)}
  else if(arr==='rad'){const n=Math.max(3,Math.round(num('pn',16)));put(cx,cy,0);for(let k=0;k<n;k++){const a=2*Math.PI*k/n;for(let r=sp;r<R+sp;r+=sp)put(cx+Math.cos(a)*r,cy+Math.sin(a)*r,a)}}
  else{let th=0;for(let i=0;i<30000;i++){const r=sp*th/(2*Math.PI)+sp/2;if(r>R+sp)break;put(cx+Math.cos(th)*r,cy+Math.sin(th)*r,th+Math.PI/2);th+=sp/Math.max(r,sp*0.5)}}
  x.restore()}

function renderInner(r,p,c,s){
  const W=Math.round(p[1]*s),H=Math.round(p[2]*s);c.width=W;c.height=H;
  const x=c.getContext('2d');x.fillStyle='#ffffff';x.fillRect(0,0,W,H);drawPattern(x,W,H,s,mix(r.hex,'#000000',0.45));
  const col='#000000',tcol=mix(r.hex,'#000000',0.45),dir=$('dir').value,pitch=(dir==='g'&&!r.custom?Math.max(1,num('gw',5)):r.mm)*s,top=num('mtop',14)*s,bot=num('mbot',12)*s,L=num('mleft',10)*s,R=W-num('mright',10)*s,HH=hh()*s;
  const lw=num('lw',0.2)*s,st=$('lstyle').value,dg=Math.max(1.2*s,num('dg',1)*pitch),nr=parseInt($('nr').value);
  x.strokeStyle=col;x.fillStyle=col;x.lineWidth=lw;
  const seg=(x1,y1,x2,y2)=>{x.setLineDash(st==='t'?[2*s,1.5*s]:[]);x.beginPath();x.moveTo(x1,y1);x.lineTo(x2,y2);x.stroke();
    if(st==='d'){x.setLineDash([]);const len=Math.hypot(x2-x1,y2-y1),mx=(x1+x2)/2,my=(y1+y2)/2,ux=(x2-x1)/len,uy=(y2-y1)/len,m=Math.floor(len/2/dg+1e-6);
      for(let j=-m;j<=m;j++){x.beginPath();x.arc(mx+ux*j*dg,my+uy*j*dg,Math.max(lw*1.8,0.45*s),0,6.2832);x.fill()}}};

    for(let k=0;k<=NR;k++)seg(L,y0+k*pitch,R,y0+k*pitch);
    ty=y0-HH*0.57;
  }else{
    const yT=top+HH,yB=H-bot,NC=Math.max(1,dir==='v'&&nr>0?nr:Math.floor((R-L)/pitch+1e-6)),x0=L+((R-L)-NC*pitch)/2;
    ty=top+HH*0.5;
    if(dir==='v'){for(let k=0;k<=NC;k++)seg(x0+k*pitch,yT,x0+k*pitch,yB)}
    else{const NR=Math.max(1,Math.floor((yB-yT)/pitch+1e-6)),y0=yT+((yB-yT)-NR*pitch)/2;
      for(let k=0;k<=NR;k++)seg(x0,y0+k*pitch,x0+NC*pitch,y0+k*pitch);

function pdf(jpgs,wmm,hmm){
  const enc=new TextEncoder(),parts=[],off=[];let len=0;
  const push=b=>{if(typeof b==='string')b=enc.encode(b);parts.push(b);len+=b.length};
  const wp=(wmm*72/25.4).toFixed(2),hp=(hmm*72/25.4).toFixed(2),n=jpgs.length;
  push('%PDF-1.4\n');
  off[1]=len;push('1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');
  off[2]=len;push(`2 0 obj\n<< /Type /Pages /Count ${n} /Kids [${jpgs.map((_,i)=>`${3+3*i} 0 R`).join(' ')}] >>\nendobj\n`);
  jpgs.forEach((j,i)=>{
    const pg=3+3*i,im=pg+1,ct=pg+2,cs=`q ${wp} 0 0 ${hp} 0 0 cm /Im0 Do Q`;
    off[pg]=len;push(`${pg} 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${wp} ${hp}] /Resources << /XObject << /Im0 ${im} 0 R >> >> /Contents ${ct} 0 R >>\nendobj\n`);
    off[im]=len;push(`${im} 0 obj\n<< /Type /XObject /Subtype /Image /Width ${j.w} /Height ${j.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${j.b.length} >>\nstream\n`);push(j.b);push('\nendstream\nendobj\n');
    off[ct]=len;push(`${ct} 0 obj\n<< /Length ${cs.length} >>\nstream\n${cs}\nendstream\nendobj\n`);
  });
  const total=3+3*n,xr=len;
  push(`xref\n0 ${total}\n0000000000 65535 f \n`+off.slice(1).map(o=>String(o).padStart(10,'0')+' 00000 n \n').join(''));
  push(`trailer\n<< /Size ${total} /Root 1 0 R >>\nstartxref\n${xr}\n%%EOF`);
  const out=new Uint8Array(len);let p=0;parts.forEach(b=>{out.set(b,p);p+=b.length});return out;
}
