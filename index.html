<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>罫線サイズ 表紙メーカー</title>
<style>
:root{--bg:#f6f5f1;--fg:#222;--card:#fff;--bd:#d8d6cf;color-scheme:light;box-sizing:border-box;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1d1b;--fg:#eee;--card:#2a2a27;--bd:#444;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1d1d1b;--fg:#eee;--card:#2a2a27;--bd:#444;color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--fg);font-family:'Hiragino Sans','Yu Gothic','Noto Sans JP',sans-serif;padding:16px;max-width:760px;margin:auto}
h1{font-size:20px;margin:8px 0 12px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
#grid button{border:2px solid transparent;border-radius:8px;padding:8px 2px;font-size:14px;cursor:pointer;line-height:1.3}
#grid button small{display:block;font-size:10px;opacity:.8}
#grid button.on{border-color:var(--fg)}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:14px 0}
select,.act,input{font:inherit;padding:8px 12px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--fg)}
.act{cursor:pointer;font-weight:600}
canvas{display:block;margin:0 auto;max-width:100%;max-height:70vh;border:1px solid var(--bd);box-shadow:0 2px 10px #0003}
#msg{min-height:1.4em;font-size:13px}
#tbl table{font-size:12px;border-collapse:collapse}#tbl td{padding:2px 10px;border-bottom:1px solid var(--bd)}
</style></head><body>
<h1>罫線サイズ 表紙メーカー</h1>
<div id="grid"></div>
<div class="row">
<label>種類 <select id="kind"><option value="c">表紙</option><option value="i">中紙（罫線）</option></select></label>
<label>用紙 <select id="paper"></select></label>
<label>向き <select id="ori"><option value="p">縦</option><option value="l">横</option></select></label>
</div>
<div class="row"><label>罫線 <select id="dir"><option value="h">横罫</option><option value="v">縦罫</option><option value="g">方眼</option></select></label><label>方眼の幅 <input id="gw" type="number" value="5" step="0.5" min="1" style="width:64px"> mm</label><label>線 <select id="lstyle"><option value="n">普通罫線</option><option value="d">ドット罫線</option><option value="t">点線</option></select></label><label>太さ <input id="lw" type="number" value="0.2" step="0.05" min="0.05" style="width:64px"> mm</label><label>ドット間隔 <input id="dg" type="number" value="6" min="1" style="width:56px"> mm</label></div>
<div id="inner"><div class="row"><label>中央 <input id="tc" size="14" value="No. ________"></label><label>右 <input id="tr" size="22" value="日付 ______年 ____月 ____日"></label></div>
<div class="row"><label>上余白 <input id="mtop" type="number" value="14" min="0" style="width:64px"> mm</label><label>下余白 <input id="mbot" type="number" value="12" min="0" style="width:64px"> mm</label><label>行数 <input id="nr" type="number" min="1" placeholder="自動" style="width:72px"></label></div>
<p id="calc"></p>
<details><summary>全サイズの行数表</summary><div id="tbl"></div></details></div>
<canvas id="cv"></canvas>
<div class="row"><button class="act" id="one">このサイズをPDFで保存</button><button class="act" id="all">全25種を1つのPDFで保存</button></div>
<p id="msg"></p>
<script>
const F="'Hiragino Sans','Yu Gothic','Noto Sans JP',sans-serif";
const PAPERS=[['B3 (364×515)',364,515],['A3 (297×420)',297,420],['B4 (257×364)',257,364],['A4 (210×297)',210,297],['B5 (182×257)',182,257],['セミB5 (179×252)',179,252],['A5 (148×210)',148,210],['B6 (128×182)',128,182],['A6 (105×148)',105,148]];
const TINT=[0,.35,.6];
const hexToRgb=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const mix=(a,b,t)=>{const A=hexToRgb(a),B=hexToRgb(b);return '#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join('')};
const lum=h=>{const [r,g,b]=hexToRgb(h);return(0.299*r+0.587*g+0.114*b)/255};
// [入力用, 手書き, mm表記, mm値, 色, 段, 市販]
const G=[['e','ε',['3','3 1/6','3 1/3'],[3,19/6,10/3],'#f0a04b'],
['d','d',['3 1/2','3 3/4','4'],[3.5,3.75,4],'#5fbf6a'],
['D','D',['4 1/3','4 2/3'],[13/3,14/3],'#b5d94a'],
['C','C',['5','5 1/2'],[5,5.5],'#7ec8ee',1],
['B','B',['6','6 1/2'],[6,6.5],'#4a7fd4',1],
['A','A',['7','7 1/2'],[7,7.5],'#e0504a',1]];
const rows=[];
G.forEach(([k,h,t,v,c,m])=>t.forEach((tx,i)=>rows.push({key:k+(i?i:''),hw:h+['','’','”'][i],mmT:tx,mm:v[i],hex:mix(c,'#ffffff',TINT[i]),mk:m&&i===0})));
[['U','U','8',8,'#9b6b4a',1],['Ul','Ul','9',9,'#c9aee3',0],['UL','UL','10',10,'#9a6fc2',1],['Uw','Uw','11',11,'#ecd96a',0],['UW','UW','12',12,'#f6efb4',1],
['Ux','Ux','13.5',13.5,'#cfcfcf',0],['UX','UX','15',15,'#9a9a9a',0],['Uy','Uy','16.5',16.5,'#f8bfd6',0],['UY','UY','18',18,'#ee8fb4',0],['Uz','Uz','21',21,'#6e6e6e',0],['UZ','UZ','25',25,'#2e2e2e',0]]
.forEach(([k,h,t,v,c,m])=>rows.push({key:k,hw:h,mmT:t,mm:v,hex:c,mk:!!m}));

function render(r,p,c,s){if($('kind').value==='i')return renderInner(r,p,c,s);
  const W=Math.round(p[1]*s),H=Math.round(p[2]*s);c.width=W;c.height=H;
  const x=c.getContext('2d'),dark=lum(r.hex)<0.5,fg=dark?'#ffffff':'#222222';
  x.fillStyle=r.hex;x.fillRect(0,0,W,H);
  x.fillStyle='#2b2b2b';x.fillRect(0,0,9*s,H);
  const L=16*s,R=W-8*s,bw=(R-L)*0.78,bh=Math.min(42*s,H*0.16),bx=L+((R-L)-bw)/2,by=H*0.4-bh/2;
  const dir=$('dir').value,pitch=(dir==='g'?Math.max(1,num('gw',5)):r.mm)*s,lw=num('lw',0.2)*s,st=$('lstyle').value,dg=Math.max(1,num('dg',6))*s,lc=mix(r.hex,dark?'#ffffff':'#000000',0.28);
  x.strokeStyle=lc;x.fillStyle=lc;x.lineWidth=lw;
  const seg=(x1,y1,x2,y2)=>{x.setLineDash(st==='t'?[2*s,1.5*s]:[]);x.beginPath();x.moveTo(x1,y1);x.lineTo(x2,y2);x.stroke();
    if(st==='d'){x.setLineDash([]);const len=Math.hypot(x2-x1,y2-y1),mx=(x1+x2)/2,my=(y1+y2)/2,ux=(x2-x1)/len,uy=(y2-y1)/len,m=Math.floor(len/2/dg+1e-6);
      for(let j=-m;j<=m;j++){x.beginPath();x.arc(mx+ux*j*dg,my+uy*j*dg,Math.max(lw*1.8,0.45*s),0,6.2832);x.fill()}}};
  const aT=14*s,aB=H-36*s;
  if(dir!=='v')for(let y=aT;y<=aB+1e-6;y+=pitch)seg(L,y,R,y);
  if(dir!=='h')for(let xx=L;xx<=R+1e-6;xx+=pitch)seg(xx,aT,xx,aB);
  x.setLineDash([]);
  x.fillStyle=mix(r.hex,'#ffffff',0.78);x.strokeStyle=fg;x.lineWidth=0.4*s;
  x.fillRect(bx,by,bw,bh);x.strokeRect(bx,by,bw,bh);x.beginPath();x.moveTo(bx,by+bh/2);x.lineTo(bx+bw,by+bh/2);x.stroke();
    x.fillStyle='#222';x.font=`${3.2*s}px ${F}`;x.textBaseline='top';x.textAlign='left';
  x.fillText('名前',bx+2*s,by+bh/2+1.5*s);
  x.fillStyle=fg;x.textBaseline='alphabetic';x.font=`bold ${20*s}px ${F}`;x.fillText(r.hw,L,H-12*s);
  x.textAlign='right';x.font=`${6*s}px ${F}`;x.fillText(r.mmT+' mm',R,H-12*s);
}
const pp=()=>{const p=PAPERS[$('paper').value];return $('ori').value==='l'?[p[0],p[2],p[1]]:p};
const num=(id,d)=>{const v=parseFloat(document.getElementById(id).value);return isFinite(v)&&v>=0?v:d};
function renderInner(r,p,c,s){
  const W=Math.round(p[1]*s),H=Math.round(p[2]*s);c.width=W;c.height=H;
  const x=c.getContext('2d');x.fillStyle='#ffffff';x.fillRect(0,0,W,H);
  const col='#000000',tcol=mix(r.hex,'#000000',0.45),dir=$('dir').value,pitch=(dir==='g'?Math.max(1,num('gw',5)):r.mm)*s,top=num('mtop',14)*s,bot=num('mbot',12)*s,L=10*s,R=W-10*s,HH=7*s;
  const lw=num('lw',0.2)*s,st=$('lstyle').value,dg=Math.max(1,num('dg',6))*s,nr=parseInt($('nr').value);
  x.strokeStyle=col;x.fillStyle=col;x.lineWidth=lw;
  const seg=(x1,y1,x2,y2)=>{x.setLineDash(st==='t'?[2*s,1.5*s]:[]);x.beginPath();x.moveTo(x1,y1);x.lineTo(x2,y2);x.stroke();
    if(st==='d'){x.setLineDash([]);const len=Math.hypot(x2-x1,y2-y1),mx=(x1+x2)/2,my=(y1+y2)/2,ux=(x2-x1)/len,uy=(y2-y1)/len,m=Math.floor(len/2/dg+1e-6);
      for(let j=-m;j<=m;j++){x.beginPath();x.arc(mx+ux*j*dg,my+uy*j*dg,Math.max(lw*1.8,0.45*s),0,6.2832);x.fill()}}};
  let ty;
  if(dir==='h'){
    const n=Math.floor((H-top-bot-HH)/pitch+1e-6),NR=Math.max(1,nr>0?nr:n),y0=top+((H-top-bot)-NR*pitch-HH)/2+HH;
    for(let k=0;k<=NR;k++)seg(L,y0+k*pitch,R,y0+k*pitch);
    ty=y0-4*s;
  }else{
    const yT=top+HH,yB=H-bot,NC=Math.max(1,dir==='v'&&nr>0?nr:Math.floor((R-L)/pitch+1e-6)),x0=L+((R-L)-NC*pitch)/2;
    ty=top+3.5*s;
    if(dir==='v'){for(let k=0;k<=NC;k++)seg(x0+k*pitch,yT,x0+k*pitch,yB)}
    else{const NR=Math.max(1,Math.floor((yB-yT)/pitch+1e-6)),y0=yT+((yB-yT)-NR*pitch)/2;
      for(let k=0;k<=NR;k++)seg(x0,y0+k*pitch,x0+NC*pitch,y0+k*pitch);
      for(let k=0;k<=NC;k++)seg(x0+k*pitch,y0,x0+k*pitch,y0+NR*pitch)}
  }
  x.setLineDash([]);
  x.fillStyle=tcol;x.font=`${3.5*s}px ${F}`;x.textBaseline='alphabetic';
  x.textAlign='left';x.fillText(dir==='g'?'\u65b9\u773c '+num('gw',5)+'mm':r.hw+'  '+r.mmT+'mm',L,ty);
  x.textAlign='center';x.fillText($('tc').value,W/2,ty);
  x.textAlign='right';x.fillText($('tr').value,R,ty);
}
function pdf(jpgs,wmm,hmm){
  const enc=new TextEncoder(),parts=[],off=[];let len=0;
  const push=b=>{if(typeof b==='string')b=enc.encode(b);parts.push(b);len+=b.length};
  const wp=(wmm*72/25.4).toFixed(2),hp=(hmm*72/25.4).toFixed(2),n=jpgs.length;
  push('%PDF-1.4\n');
  off[1]=len;push('1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');
  off[2]=len;push(`2 0 obj\n<< /Type /Pages /Count ${n} /Kids [${jpgs.map((_,i)=>`${3+3*i} 0 R`).join(' ')}] >>\nendobj\n`);
  jpgs.forEach((j,i)=>{
    const pg=3+3*i,im=pg+1,ct=pg+2,cs=`q ${wp} 0 0 ${hp} 0 0 cm /Im0 Do Q`;
    off[pg]=len;push(`${pg} 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${wp} ${hp}] /Resources << /XObject << /Im0 ${im} 0 R >> >> /Contents ${ct} 0 R >>\nendobj\n`);
    off[im]=len;push(`${im} 0 obj\n<< /Type /XObject /Subtype /Image /Width ${j.w} /Height ${j.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${j.b.length} >>\nstream\n`);push(j.b);push('\nendstream\nendobj\n');
    off[ct]=len;push(`${ct} 0 obj\n<< /Length ${cs.length} >>\nstream\n${cs}\nendstream\nendobj\n`);
  });
  const total=3+3*n,xr=len;
  push(`xref\n0 ${total}\n0000000000 65535 f \n`+off.slice(1).map(o=>String(o).padStart(10,'0')+' 00000 n \n').join(''));
  push(`trailer\n<< /Size ${total} /Root 1 0 R >>\nstartxref\n${xr}\n%%EOF`);
  const out=new Uint8Array(len);let p=0;parts.forEach(b=>{out.set(b,p);p+=b.length});return out;
}
const $=id=>document.getElementById(id),cv=$('cv'),msg=$('msg');
let cur=rows.find(r=>r.key==='UW');
PAPERS.forEach((p,i)=>{const o=document.createElement('option');o.value=i;o.textContent=p[0];$('paper').append(o)});$('paper').value=5;
rows.forEach(r=>{const b=document.createElement('button');b.style.background=r.hex;b.style.color=lum(r.hex)<0.5?'#fff':'#222';
  b.innerHTML=`${r.hw}<small>${r.mmT}mm</small>`;b.onclick=()=>{cur=r;autoMargin();draw()};r.btn=b;$('grid').append(b)});
function autoMargin(){$('mtop').value=5;$('mbot').value=5;$('nr').value=''}
function calc(){const p=pp(),H=p[2],mt=num('mtop',14),mb=num('mbot',12);
  if($('dir').value!=='h'){const gp=$('dir').value==='g'?num('gw',5):cur.mm,nc=Math.floor((p[1]-20)/gp+1e-6),nrr=Math.floor((H-mt-mb-7)/gp+1e-6);$('calc').textContent=$('dir').value==='v'?`${cur.hw}\uff08${cur.mmT}mm\uff09: ${nc}\u5217\uff08\u7dda${nc+1}\u672c\uff09`:`\u65b9\u773c ${gp}mm: \u6a2a${nc}\u30de\u30b9\u00d7\u7e26${nrr}\u30de\u30b9`;$('tbl').innerHTML='';return}
  const f=(m,q)=>{const n=q>0?q:Math.floor((H-mt-mb-7)/m+1e-6),sl=(H-mt-mb)-n*m-7;return[n,+(mt+sl/2).toFixed(1),+(mb+sl/2).toFixed(1)]};
  const[n,ru,rd]=f(cur.mm,parseInt($('nr').value));$('calc').textContent=`${cur.hw}（${cur.mmT}mm）: ${n}行（線${n+1}本）／上の余白 ${ru}mm・下の余白 ${rd}mm`;
  $('tbl').innerHTML='<table>'+rows.map(r=>{const[k,m1,m2]=f(r.mm);return`<tr><td>${r.hw}</td><td>${r.mmT}mm</td><td>${k}行</td><td>上${m1}・下${m2}mm</td></tr>`}).join('')+'</table>'}
function draw(){rows.forEach(r=>r.btn.classList.toggle('on',r===cur));const inn=$('kind').value==='i';$('inner').style.display=inn?'':'none';render(cur,pp(),cv,5);if(inn)calc()}
$('paper').onchange=()=>{autoMargin();draw()};$('ori').onchange=draw;$('kind').onchange=draw;['tc','tr','mtop','mbot','nr','lw','dg','lstyle','dir','gw'].forEach(i=>$(i).oninput=draw);autoMargin();draw();
async function toJpg(r,p){const c=document.createElement('canvas');render(r,p,c,6);
  const b=await new Promise(res=>c.toBlob(res,'image/jpeg',0.92));return{b:new Uint8Array(await b.arrayBuffer()),w:c.width,h:c.height}}
async function save(list,name){
  msg.textContent='作成中…';
  try{const dl=await claude.use('downloads');
    if(!dl){msg.textContent='この画面では保存できません。claude.ai で開いてください。';return}
    const p=pp(),j=[];for(const r of list)j.push(await toJpg(r,p));
    await dl.save({filename:name,data:pdf(j,p[1],p[2])});msg.textContent='保存しました';
  }catch(e){msg.textContent=e&&e.code==='declined'?'キャンセルしました':'保存できませんでした（'+((e&&e.code)||'error')+'）'}
}
$('one').onclick=()=>save([cur],`${$('kind').value==='i'?'paper':'cover'}_${cur.key}.pdf`);
$('all').onclick=()=>save(rows,$('kind').value==='i'?'papers_all.pdf':'covers_all.pdf');
</script></body></html>
